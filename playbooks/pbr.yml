---
# PBR для Vologda + default route для Cherepovets.
# Design B: SW29 = L3-свитч, R28 = border router. PBR на R28 на routed-link от SW29.
#
# Чокурдах (домашка) = Vologda (у нас) = SW29 + R28
# Лабытнанги (домашка) = Cherepovets (у нас) = R27
#
# Запуск:
#   ansible-playbook playbooks/pbr.yml --check --diff -v   # план
#   ansible-playbook playbooks/pbr.yml                     # apply

- name: PBR Vologda (L3 switch + border router) + default route Cherepovets
  hosts: SW29,R28,R27
  gather_facts: false
  tasks:

    # =================================================================
    # SW29 - превращаем в L3-свитч: SVI Vlan10, routed-port к R28
    # =================================================================

    - name: SW29 - enable IP routing (включить L3-маршрутизацию)
      when: inventory_hostname == 'SW29'
      cisco.ios.ios_config:
        lines:
          - ip routing

    - name: SW29 - SVI Vlan10 (gateway для пользователей)
      when: inventory_hostname == 'SW29'
      cisco.ios.ios_config:
        lines:
          - description Gateway VLAN 10 USERS
          - ip address 10.7.10.1 255.255.255.0
          - no shutdown
        parents: interface Vlan10

    - name: SW29 - Ethernet0/2 как routed-port к R28 (no switchport)
      when: inventory_hostname == 'SW29'
      cisco.ios.ios_config:
        lines:
          - description L3 link to R28 (Vologda border router)
          - no switchport
          - ip address 10.7.254.0 255.255.255.252
          - no shutdown
        parents: interface Ethernet0/2

    - name: SW29 - default route через R28
      when: inventory_hostname == 'SW29'
      cisco.ios.ios_config:
        lines:
          - ip route 0.0.0.0 0.0.0.0 10.7.254.1 name default-via-R28

    # =================================================================
    # R28 - border router: routed-port к SW29, PBR + SLA + Track
    # =================================================================

    # Подчищаем возможные sub-interface'ы от старой попытки Design A
    - name: R28 - убрать старые sub-interface'ы (если были)
      when: inventory_hostname == 'R28'
      cisco.ios.ios_config:
        lines:
          - no interface Ethernet0/2.10
          - no interface Ethernet0/2.250
        match: none

    - name: R28 - Ethernet0/2 как routed-port к SW29 (PBR ingress здесь)
      when: inventory_hostname == 'R28'
      cisco.ios.ios_config:
        lines:
          - description L3 link to SW29 (PBR ingress)
          - ip address 10.7.254.1 255.255.255.252
          - ip policy route-map PBR-VOLOGDA
          - no shutdown
        parents: interface Ethernet0/2

    - name: R28 - статический маршрут к VLAN 10 USERS subnet (через SW29)
      when: inventory_hostname == 'R28'
      cisco.ios.ios_config:
        lines:
          - ip route 10.7.10.0 255.255.255.0 10.7.254.0 name users-via-SW29

    - name: R28 - IP SLA 1 (probe ISP-1 = R25)
      when: inventory_hostname == 'R28'
      cisco.ios.ios_config:
        lines:
          - icmp-echo 172.16.0.14 source-interface Ethernet0/1
          - frequency 5
        parents: ip sla 1

    - name: R28 - IP SLA 2 (probe ISP-2 = R26)
      when: inventory_hostname == 'R28'
      cisco.ios.ios_config:
        lines:
          - icmp-echo 172.16.0.12 source-interface Ethernet0/0
          - frequency 5
        parents: ip sla 2

    - name: R28 - schedule обе SLA
      when: inventory_hostname == 'R28'
      cisco.ios.ios_config:
        lines:
          - ip sla schedule 1 life forever start-time now
          - ip sla schedule 2 life forever start-time now

    - name: R28 - Track 1 (ISP-1 reachability)
      when: inventory_hostname == 'R28'
      cisco.ios.ios_config:
        lines:
          - delay down 10 up 5
        parents: track 1 ip sla 1 reachability

    - name: R28 - Track 2 (ISP-2 reachability)
      when: inventory_hostname == 'R28'
      cisco.ios.ios_config:
        lines:
          - delay down 10 up 5
        parents: track 2 ip sla 2 reachability

    - name: R28 - ACL USERS_TO_MSK_SPB
      when: inventory_hostname == 'R28'
      cisco.ios.ios_config:
        lines:
          - permit ip 10.7.0.0 0.0.255.255 10.1.0.0 0.0.255.255
          - permit ip 10.7.0.0 0.0.255.255 10.2.0.0 0.0.255.255
        parents: ip access-list extended USERS_TO_MSK_SPB

    - name: R28 - ACL USERS_TO_TRD_CHR
      when: inventory_hostname == 'R28'
      cisco.ios.ios_config:
        lines:
          - permit ip 10.7.0.0 0.0.255.255 10.5.0.0 0.0.255.255
          - permit ip 10.7.0.0 0.0.255.255 10.6.0.0 0.0.255.255
        parents: ip access-list extended USERS_TO_TRD_CHR

    - name: R28 - route-map seq 10 (MSK/SPB - primary ISP-1)
      when: inventory_hostname == 'R28'
      cisco.ios.ios_config:
        lines:
          - match ip address USERS_TO_MSK_SPB
          - set ip next-hop verify-availability 172.16.0.14 10 track 1
          - set ip next-hop verify-availability 172.16.0.12 20 track 2
        parents: route-map PBR-VOLOGDA permit 10

    - name: R28 - route-map seq 20 (TRD/CHR - primary ISP-2)
      when: inventory_hostname == 'R28'
      cisco.ios.ios_config:
        lines:
          - match ip address USERS_TO_TRD_CHR
          - set ip next-hop verify-availability 172.16.0.12 10 track 2
          - set ip next-hop verify-availability 172.16.0.14 20 track 1
        parents: route-map PBR-VOLOGDA permit 20

    # =================================================================
    # R27 (Cherepovets/Лабытнанги) - простой default route
    # =================================================================

    - name: R27 - default route via R25 (Triada)
      when: inventory_hostname == 'R27'
      cisco.ios.ios_config:
        lines:
          - ip route 0.0.0.0 0.0.0.0 172.16.0.10 name default-via-R25
        save_when: modified
